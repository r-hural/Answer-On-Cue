name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend environment
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          Get-ChildItem backend/requirements -Filter *.txt | Sort-Object Name | ForEach-Object {
            backend/.venv/Scripts/python.exe -m pip install -r $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Frontend packages
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # ruff, pytest, ESLint, Vitest and the build; the Playwright tests stay local for now.
      - name: Check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check.ps1 -SkipE2E
